spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/digital_inertia_erp}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Database structure is strictly managed by Flyway
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration,classpath:db/dev-seeds
    table: flyway_schema_history
    clean-disabled: true # Never allow Flyway clean to drop tables

logging:
  level:
    com.digitalinertia.erp: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
