spring:
  datasource:
    url: jdbc:h2:mem:digital_inertia_erp_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false # H2 creates schema via JPA create-drop during tests

app:
  jwt:
    secret: ""
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
